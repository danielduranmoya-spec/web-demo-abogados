<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@600;800&display=swap">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #071713; }
  body { position: relative; font-family: Manrope, sans-serif; color: #fff; }
  .full { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 40%; }
  .bgblur { position: absolute; inset: -40px; width: 1160px; height: 2000px; object-fit: cover; filter: blur(30px) brightness(.35); }
  .card { position: absolute; left: 40px; width: 1000px; top: 470px; border-radius: 26px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.6); border: 2px solid rgba(201,161,91,.5); background: #0B211C; }
  .card .bar { height: 46px; background: #10251F; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
  .card .bar i { width: 13px; height: 13px; border-radius: 50%; background: rgba(243,238,228,.25); }
  .card .bar span { margin-left: 16px; font: 600 18px Manrope; color: rgba(243,238,228,.55); }
  .card img { display: block; width: 100%; }
  .cap { position: absolute; left: 60px; right: 60px; top: 1190px; text-align: center; font: 800 76px/1.12 Manrope; letter-spacing: -.02em; text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.6); -webkit-text-stroke: 2px rgba(0,0,0,.35); }
  .cap.alto { top: 230px; }
  .cap .w { display: inline-block; margin: 4px 2px; padding: 4px 14px 10px; background: rgba(7,23,19,.86); border-radius: 14px; transform-origin: 50% 70%; -webkit-text-stroke: 0; text-shadow: none; }
  .cap .w.on { color: #E3C68A; }
  .hook { position: absolute; left: 50px; right: 50px; top: 210px; text-align: center; }
  .hook b { display: inline-block; font: 800 64px/1.1 Manrope; background: #C9A15B; color: #071713; padding: 14px 26px; border-radius: 18px; box-shadow: 0 10px 0 #8E6C33; }
  .flash { position: absolute; inset: 0; background: #FFF6DC; opacity: 0; pointer-events: none; }
  .end { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 30px; padding: 0 80px; }
  .end h2 { font: 500 112px/1 'Bodoni Moda', serif; letter-spacing: -.03em; margin: 0; }
  .end h2 em { color: #E3C68A; }
  .end p { margin: 0; font: 600 40px/1.3 Manrope; color: rgba(243,238,228,.8); }
  .end .cta { font: 800 54px/1 Manrope; background: #C9A15B; color: #071713; padding: 26px 44px; border-radius: 999px; }
  .end .firma { font: 600 32px Manrope; color: #E3C68A; letter-spacing: .06em; }
  .tag { position: absolute; left: 50%; transform: translateX(-50%); top: 120px; font: 600 26px Manrope; letter-spacing: .24em; color: #E3C68A; text-transform: uppercase; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div id="root"></div>
<div class="flash" id="flash"></div>
<script>
const CLIPS = '/clips/';
const SEG = [
  { a: 0, b: 3.4, clip: 'hero', f0: 0, tipo: 'full', cap: [[0.5, 'Web para un despacho de abogados de Mérida']], hook: '¿Un abogado con web en 3D?' },
  { a: 3.4, b: 9.8, clip: 'balanza', f0: 6, tipo: 'full', cap: [[3.5, 'Marcas las pruebas que tienes'], [6.3, 'y la balanza 3D se inclina']], alto: true },
  { a: 9.8, b: 14.8, clip: 'video', f0: 45, tipo: 'card', cap: [[9.9, 'El vídeo te pregunta tu caso'], [12.5, 'y te lleva a tu respuesta']] },
  { a: 14.8, b: 17.0, clip: 'desk', f0: 18, tipo: 'card', cap: [[14.9, 'Perfecta en ordenador']] },
  { a: 17.0, b: 20.6, clip: 'scroll', f0: 8, tipo: 'full', cap: [[17.1, 'y en móvil, con precios y cita']] },
  { a: 20.6, b: 24.0, tipo: 'end' }
];
const FPS = 30;
const root = document.getElementById('root');
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function frameSrc(clip, n) { return CLIPS + clip + '/f' + String(n).padStart(4, '0') + '.jpg'; }
async function load(src) { const i = new Image(); i.src = src; await i.decode(); return i; }

window.renderAt = async function (t) {
  const s = SEG.find(x => t >= x.a && t < x.b) || SEG[SEG.length - 1];
  const lt = t - s.a; root.innerHTML = '';
  // Corte con flash y zoom de entrada
  const punch = 1 + 0.07 * (1 - ease(lt / 0.35));
  document.getElementById('flash').style.opacity = s.a > 0 ? Math.max(0, 0.55 - lt * 3) : 0;
  if (s.tipo === 'full') {
    const img = await load(frameSrc(s.clip, s.f0 + Math.floor(lt * FPS)));
    img.className = 'full'; img.style.transform = `scale(${punch})`; root.appendChild(img);
  } else if (s.tipo === 'card') {
    const src = frameSrc(s.clip, s.f0 + Math.floor(lt * FPS));
    const bg = await load(src); bg.className = 'bgblur'; root.appendChild(bg);
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<div class="bar"><i></i><i></i><i></i><span>valdes-moncayo · abogados en Mérida</span></div>';
    const img = await load(src); card.appendChild(img); card.style.transform = `scale(${punch})`;
    root.appendChild(card);
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = s.clip === 'video' ? 'Vídeo interactivo' : 'Ordenador · tablet · móvil'; root.appendChild(tag);
  } else {
    const bg = await load(frameSrc('hero', 100)); bg.className = 'bgblur'; root.appendChild(bg);
    const e = document.createElement('div'); e.className = 'end';
    const k = i => `style="opacity:${ease((lt - i * 0.35) / 0.4)};transform:translateY(${(1 - ease((lt - i * 0.35) / 0.4)) * 40}px)"`;
    e.innerHTML = `<h2 ${k(0)}>¿Quieres una <em>así</em> para tu negocio?</h2><p ${k(1)}>3D, vídeo interactivo, SEO y textos legales. Adaptada a cualquier pantalla.</p><div class="cta" ${k(2)}>Escríbeme «WEB»</div><div class="firma" ${k(3)}>Daniel Durán · webs a medida</div>`;
    root.appendChild(e);
  }
  if (s.hook && lt < 2.6) {
    const h = document.createElement('div'); h.className = 'hook';
    const k = ease(lt / 0.25); h.innerHTML = `<b style="transform:scale(${0.6 + 0.4 * k}) rotate(-2deg)">${s.hook}</b>`; root.appendChild(h);
  }
  // Subtítulos palabra a palabra
  const caps = (s.cap || []).filter(c => t >= c[0]); const c = caps[caps.length - 1];
  if (c && !(s.hook && lt < 2.6 && false)) {
    const words = c[1].split(' '); const per = 0.16; const el = document.createElement('div'); el.className = 'cap' + (s.alto ? ' alto' : '');
    const ct = t - c[0];
    el.innerHTML = words.map((w, i) => { const wt = ct - i * per; if (wt < 0) return ''; const pop = 1 + 0.25 * Math.max(0, 1 - wt / 0.12); return `<span class="w${wt < per * 1.5 ? ' on' : ''}" style="transform:scale(${pop})">${w}</span>`; }).join(' ');
    root.appendChild(el);
  }
};
document.fonts.ready.then(() => { window.listo = true; });
</script>
</body>
</html>
